databases:
  - name: tarang-db
    databaseName: tarang
    user: tarang
    plan: free
    region: singapore

services:
  - type: web
    name: tarang-radio
    runtime: node
    plan: free
    region: singapore
    buildCommand: "npm run build:frontend && npm --prefix backend install --omit=dev"
    startCommand: "node backend/src/server.js"
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: tarang-db
          property: connectionString
